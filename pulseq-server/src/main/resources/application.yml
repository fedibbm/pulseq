server:
  port: 8080

spring:
  application:
    name: pulseq-server

pulseq:
  capacity: 1000
  visibility-timeout-ms: 30000
  retry-base-delay-ms: 500
  max-retry-delay-ms: 60000
  max-retries: 3
  consumer-threads: 8
  timeout-check-rate-ms: 1000
  # How long a REST publish waits for room in a full topic before answering 429.
  publish-timeout-ms: 2000
  # JDBC connections kept open by the PostgreSQL store. Store calls happen while holding the
  # per-topic queue lock, so a pool avoids a TCP+auth handshake on every state transition.
  store-pool-size: 10
  store: memory
  postgres-url: jdbc:postgresql://localhost:5432/pulseq
  postgres-user: pulseq
  postgres-password: pulseq
  # Directory containing the built Angular dashboard. Resolved relative to the working
  # directory, or absolute (e.g. /app/dashboard in Docker). Optional: when the directory
  # is missing the server simply serves no dashboard.
  dashboard-path: ../pulseq-dashboard/dist/pulseq-dashboard/browser
  # Purge completed messages (acknowledged/dead-lettered/expired) older than this. 0 disables.
  retention-hours: 24
  retention-sweep-rate-ms: 60000
  # Cluster mode: this server is one broker of a cluster and serves clients only while it is
  # the leader. See "Cluster mode" in the README.
  cluster:
    enabled: false
    node-id: 0
    # Every broker, this one included: id@clusterHost:clusterPort@publicUrl, comma-separated.
    nodes: ""
    # Where this broker keeps its Raft log.
    data-dir: ./data
    # How long a publish or acknowledgement waits for a majority of brokers.
    commit-timeout-ms: 5000
    # Timing in ticks of tick-ms: a broker that hears no leader for a random time between
    # election-min-ticks and election-max-ticks starts an election.
    tick-ms: 10
    election-min-ticks: 50
    election-max-ticks: 100
    heartbeat-ticks: 10

logging:
  level:
    com.pulseq: INFO
